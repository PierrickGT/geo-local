commands:
  install: pnpm install
  build: pnpm build
  lint: pnpm lint
  test: pnpm --filter @geo-runtime/explorer run test
  typecheck: pnpm --filter @geo-runtime/explorer exec tsc --noEmit

services:
  explorer:
    start: pnpm --filter @geo-runtime/explorer dev
    stop: lsof -ti :3003 | xargs kill
    healthcheck: curl -sf http://localhost:3003
    port: 3003
    depends_on: []
